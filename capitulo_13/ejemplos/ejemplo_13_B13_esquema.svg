<text x="710" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#17263a">Después de reaccionar</text>
<text x="1030" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#17263a">Unidad</text>
