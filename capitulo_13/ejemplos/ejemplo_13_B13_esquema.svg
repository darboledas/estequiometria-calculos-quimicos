<text x="75" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#17263a">C8H12N2O3S</text>
<text x="410" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#17263a">0</text>
<text x="710" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#17263a">5,80</text>
<text x="1030" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#17263a">mol</text>
